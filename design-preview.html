<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ece9e1">
<title>萌豚挑战 · 全站视觉方向预览</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@500;600;700;900&display=swap');
:root{font-family:'Noto Sans SC',sans-serif;color:#1e282a;background:#ece9e1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#ece9e1}.preview-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px max(20px,calc((100vw - 1260px)/2));background:#f7f5f0;border-bottom:1px solid #d8d4cb}.preview-brand{font-size:12px;font-weight:800;letter-spacing:.12em;color:#697373}.preview-brand b{display:block;margin-top:3px;font-size:15px;letter-spacing:0;color:#192124}.preview-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.switches{display:flex;gap:5px;padding:4px;background:#ebe8e0;border-radius:12px}.switches button{border:0;border-radius:9px;padding:9px 13px;background:transparent;color:#68716f;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.switches button[aria-pressed="true"]{background:white;color:#172328;box-shadow:0 2px 8px #17232812}.preview-wrap{max-width:1280px;margin:28px auto 56px;padding:0 24px}.preview-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;color:#616d6c;font-size:12px}.preview-note strong{color:#253235}.device{overflow:hidden;min-height:780px;border-radius:20px;box-shadow:0 22px 75px #15222022;transition:background .25s,color .25s}.site-head{display:flex;align-items:center;justify-content:space-between;padding:19px 5.2%;border-bottom:1px solid currentColor;border-color:color-mix(in srgb,currentColor 13%,transparent)}.site-brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.02em}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;font-size:16px}.site-nav{display:flex;align-items:center;gap:24px;font-size:12px;font-weight:700}.site-nav span:last-child{padding:8px 13px;border:1px solid currentColor;border-radius:99px}.page-content{padding:36px 5.2% 48px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.home-lead{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:42px;min-height:355px}.home-copy h1{margin:15px 0 12px;font-size:clamp(38px,5.2vw,66px);line-height:1.12;letter-spacing:-.06em}.home-copy p{max-width:420px;margin:0;color:var(--muted);font-size:14px;line-height:1.9}.cta-row{display:flex;align-items:center;gap:10px;margin-top:25px}.cta,.secondary{min-height:46px;padding:0 20px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer}.secondary{border:1px solid currentColor;background:transparent;color:inherit}.cover-stage{position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}.cover-stage img{position:absolute;width:184px;height:276px;object-fit:cover;border:5px solid var(--paper);box-shadow:0 20px 36px #10191935}.cover-stage img:nth-child(1){transform:rotate(-11deg) translate(-72px,4px)}.cover-stage img:nth-child(2){transform:rotate(3deg) translate(20px,-10px);z-index:1}.cover-stage img:nth-child(3){transform:rotate(12deg) translate(82px,8px)}.meta-strip{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;border-color:color-mix(in srgb,currentColor 18%,transparent);font-size:12px}.meta-strip b{font-size:15px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:38px 0 18px}.section-head h2{margin:0;font-size:24px;letter-spacing:-.04em}.section-head span{color:var(--muted);font-size:12px}.cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.anime-card{min-width:0}.poster-wrap{position:relative;overflow:hidden;aspect-ratio:1.52/1;background:#a6aaa3}.poster-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.anime-card:hover .poster-wrap img{transform:scale(1.04)}.tag{position:absolute;left:10px;top:10px;padding:5px 8px;background:var(--accent);color:white;font-size:10px;font-weight:900;letter-spacing:.08em}.anime-card h3{margin:11px 0 4px;font-size:15px;line-height:1.4}.anime-card p{margin:0;color:var(--muted);font-size:11px}.song-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;padding-top:9px;border-top:1px solid color-mix(in srgb,currentColor 13%,transparent);font-size:11px}.song-line b{font-size:12px}.song-line button{border:1px solid currentColor;border-radius:7px;padding:6px 9px;background:transparent;color:inherit;font:inherit;cursor:pointer}.library-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.library-title h1{margin:5px 0 0;font-size:38px;letter-spacing:-.06em}.filter-row{display:flex;gap:7px;flex-wrap:wrap}.filter-row span{padding:8px 11px;border:1px solid currentColor;border-radius:99px;font-size:11px}.filter-row span:first-child{background:var(--accent);border-color:var(--accent);color:white}.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}.quiz-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid color-mix(in srgb,currentColor 16%,transparent)}.quiz-top strong{font-size:13px}.quiz-top span{font-size:12px;color:var(--muted)}.quiz-layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:38px;align-items:center;max-width:970px;margin:38px auto}.quiz-art{position:relative;overflow:hidden;aspect-ratio:4/3;background:#132328}.quiz-art img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.74)}.play-control{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:72px;height:72px;border:1px solid #ffffffa3;border-radius:50%;background:#ffffffdf;color:#14201f;font-size:25px;cursor:pointer}.wave{height:30px;margin:18px 0 8px;background:linear-gradient(90deg,transparent 0 3%,var(--accent) 3% 3.5%,transparent 3.5% 6%,var(--accent) 6% 7%,transparent 7% 10%,var(--accent) 10% 11%,transparent 11% 14%,var(--accent) 14% 15%,transparent 15% 19%,var(--accent) 19% 20%,transparent 20% 25%,var(--accent) 25% 26%,transparent 26% 30%,var(--accent) 30% 32%,transparent 32% 38%,var(--accent) 38% 39%,transparent 39% 43%,var(--accent) 43% 44%,transparent 44% 50%,var(--accent) 50% 52%,transparent 52% 57%,var(--accent) 57% 58%,transparent 58% 64%,var(--accent) 64% 66%,transparent 66% 72%,var(--accent) 72% 73%,transparent 73% 80%,var(--accent) 80% 82%,transparent 82% 89%,var(--accent) 89% 90%,transparent 90%);mask-image:linear-gradient(transparent,#000 10% 90%,transparent)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 12px;border:1px solid color-mix(in srgb,currentColor 24%,transparent);background:transparent;color:inherit;text-align:left;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.answer b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:white;font-size:11px}.preview-caption{padding:0 5.2% 24px;color:var(--muted);font-size:11px}
/* 01 · Seasonal broadcast guide */
.broadcast{--paper:#f4f1e8;--ink:#1c3034;--accent:#c84d37;--gold:#c89954;--muted:#6c7774;background:var(--paper);color:var(--ink)}.broadcast .brand-mark{background:var(--ink);color:var(--paper)}.broadcast .site-head{font-family:'Noto Serif SC',serif}.broadcast .home-copy h1{font-family:'Noto Serif SC',serif;font-weight:700}.broadcast .eyebrow{color:var(--accent)}.broadcast .cover-stage{background:#e7e2d6}.broadcast .cover-stage::before{content:'2026  /  SUMMER';position:absolute;left:2%;top:14%;writing-mode:vertical-rl;color:#566361;font-size:10px;letter-spacing:.16em}.broadcast .poster-wrap{filter:saturate(.83)}.broadcast .quiz-art::after{content:'ON AIR';position:absolute;left:15px;top:15px;padding:5px 8px;background:var(--accent);color:white;font-size:10px;font-weight:900;letter-spacing:.14em}.broadcast .answer{border-width:0 0 1px;text-align:left}.broadcast .answer b{border-radius:5px;background:var(--ink)}
/* 02 · Listening room / record shop */
.vinyl{--paper:#192320;--ink:#f0ead9;--accent:#d18a53;--gold:#91ad8e;--muted:#a7b0a5;background:var(--paper);color:var(--ink)}.vinyl .site-head{border-color:#f0ead92b}.vinyl .brand-mark{border-radius:50%;background:var(--accent);color:#192320}.vinyl .site-nav span:last-child{border-color:#f0ead95c}.vinyl .home-lead{grid-template-columns:.8fr 1.2fr}.vinyl .home-copy h1{font-family:'Noto Serif SC',serif;font-weight:500;letter-spacing:-.04em}.vinyl .eyebrow{color:var(--gold)}.vinyl .cover-stage{min-height:350px;background:#26332e}.vinyl .cover-stage img{width:188px;border:0;border-radius:4px;box-shadow:0 18px 45px #0008}.vinyl .cover-stage img:nth-child(1){transform:rotate(-8deg) translate(-80px,4px)}.vinyl .cover-stage img:nth-child(2){transform:rotate(0) translate(5px,-10px);z-index:2}.vinyl .cover-stage img:nth-child(3){transform:rotate(8deg) translate(90px,4px)}.vinyl .poster-wrap{aspect-ratio:1/1;background:#2c3833}.vinyl .library-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.vinyl .anime-card{padding:10px;background:#26332e}.vinyl .anime-card .poster-wrap{position:relative;overflow:visible;aspect-ratio:1/1;margin-bottom:16px}.vinyl .anime-card .poster-wrap::after{content:'';position:absolute;z-index:0;right:-18%;top:12%;width:76%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#282c27 3px 4px);box-shadow:0 4px 20px #0008}.vinyl .anime-card .poster-wrap img{position:relative;z-index:1;width:78%;height:100%;box-shadow:8px 8px 24px #0006}.vinyl .tag{top:auto;bottom:8px;left:8px}.vinyl .quiz-layout{grid-template-columns:1fr 1fr;max-width:800px}.vinyl .quiz-art{overflow:visible;aspect-ratio:1/1;background:transparent}.vinyl .quiz-art img{position:relative;z-index:1;width:75%;height:100%;object-fit:cover;box-shadow:10px 12px 35px #0008}.vinyl .quiz-art::after{content:'';position:absolute;right:0;top:4%;width:77%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#30352f 3px 4px);box-shadow:0 4px 25px #0008}.vinyl .play-control{z-index:2;background:var(--accent);border:0;color:#17211d}.vinyl .answer{border-color:#f0ead942;border-radius:8px}.vinyl .answer b{border-radius:6px;background:var(--gold);color:#17211d}
/* 03 · Manga page / panel rhythm */
.manga{--paper:#f5f4ee;--ink:#171b1e;--accent:#2b5f9e;--red:#d9503f;--muted:#5e6465;background:var(--paper);color:var(--ink)}.manga .site-head{border-bottom:3px solid var(--ink)}.manga .brand-mark{border:2px solid var(--ink);border-radius:0;background:var(--red);color:white}.manga .site-brand{font-weight:900;letter-spacing:-.04em}.manga .site-nav span:last-child{border:2px solid var(--ink);border-radius:0}.manga .home-lead{grid-template-columns:1.1fr .9fr;gap:18px}.manga .home-copy h1{font-weight:900;line-height:1.02;letter-spacing:-.08em}.manga .eyebrow{display:inline-block;padding:5px 8px;background:var(--ink);color:white}.manga .cover-stage{min-height:350px;border:3px solid var(--ink);background:#e3e6df}.manga .cover-stage img{border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}.manga .cover-stage img:nth-child(1){transform:rotate(-8deg) translate(-70px,7px)}.manga .cover-stage img:nth-child(2){transform:rotate(0deg) translate(12px,-9px);z-index:1}.manga .cover-stage img:nth-child(3){transform:rotate(8deg) translate(91px,15px)}.manga .meta-strip{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);font-weight:800}.manga .poster-wrap{border:2px solid var(--ink)}.manga .anime-card h3{font-weight:900}.manga .tag{left:-1px;top:-1px;border:2px solid var(--ink)}.manga .quiz-layout{grid-template-columns:.7fr 1.3fr;gap:20px}.manga .quiz-art{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--accent)}.manga .quiz-art img{filter:grayscale(.12) contrast(1.04)}.manga .quiz-top{border-bottom:3px solid var(--ink)}.manga .answers{gap:8px}.manga .answer{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800}.manga .answer b{border-radius:0;background:var(--red)}.manga .section-head h2{font-family:'Noto Serif SC',serif}
@media(max-width:760px){.preview-bar{align-items:flex-start;flex-direction:column;padding:12px 14px;gap:10px}.preview-controls{width:100%;justify-content:space-between}.switches button{padding:8px 9px;font-size:11px}.preview-wrap{margin:14px auto 28px;padding:0 9px}.preview-note{padding:0 5px}.device{min-height:0;border-radius:13px}.site-head{padding:14px 5%}.site-nav{gap:11px;font-size:10px}.site-brand{font-size:12px}.brand-mark{width:28px;height:28px}.page-content{padding:22px 5% 30px}.home-lead,.vinyl .home-lead,.manga .home-lead{grid-template-columns:1fr;gap:10px;min-height:0}.home-copy h1{font-size:42px}.home-copy p{font-size:12px}.cover-stage{min-height:245px;margin-top:10px;overflow:hidden}.cover-stage img{width:132px;height:198px}.cover-stage img:nth-child(1){transform:rotate(-11deg) translate(-53px,2px)}.cover-stage img:nth-child(2){transform:rotate(3deg) translate(10px,-8px)}.cover-stage img:nth-child(3){transform:rotate(12deg) translate(66px,8px)}.broadcast .cover-stage::before{left:0}.meta-strip{flex-wrap:wrap;font-size:10px}.cover-grid,.library-grid,.vinyl .library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 11px}.anime-card h3{font-size:12px}.song-line{font-size:10px}.library-title{display:block}.library-title h1{font-size:30px;margin-bottom:14px}.filter-row{gap:5px}.filter-row span{padding:7px 9px;font-size:10px}.quiz-layout,.vinyl .quiz-layout,.manga .quiz-layout{grid-template-columns:1fr;gap:20px;margin:22px auto}.quiz-art{max-height:260px}.quiz-copy .eyebrow{margin-bottom:8px}.answers{gap:7px}.answer{min-height:54px;padding:7px;font-size:10px}.answer b{width:23px;height:23px}.preview-caption{padding:0 5% 17px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="preview-bar">
  <div class="preview-brand">VISUAL STUDY / 2026<b>萌豚挑战 · 全站改版预览</b></div>
  <div class="preview-controls">
    <div class="switches" role="group" aria-label="选择视觉方向">
      <button data-theme="broadcast" aria-pressed="true">01 番组放送台</button>
      <button data-theme="vinyl" aria-pressed="false">02 OP/ED 唱片行</button>
      <button data-theme="manga" aria-pressed="false">03 漫画分镜</button>
    </div>
    <div class="switches" role="group" aria-label="选择页面">
      <button data-page="home" aria-pressed="true">首页</button>
      <button data-page="library" aria-pressed="false">曲库</button>
      <button data-page="quiz" aria-pressed="false">答题</button>
    </div>
  </div>
</header>
<main class="preview-wrap">
  <p class="preview-note"><strong id="directionName" role="status" aria-live="polite">01 · 番组放送台</strong><span>桌面与手机宽度自适应 · 示意内容，不连接实际播放</span></p>
  <section class="device broadcast" id="device"></section>
</main>
<script>
const covers=[
 ['https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx189046-yaHWtS5FII46.jpg','Re：从零开始的异世界生活 第四季','Recollect · 铃木このみ'],
 ['https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx182205-q2AeO1owuQbO.jpg','关于我转生变成史莱姆这档事 第四季','Esoragoto · 蒼井エイル'],
 ['https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx182300-IYkq5KrkQq1V.jpg','无职转生 第三季','Ketsui no Uta · 大原ゆい子'],
 ['https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/bx195600-moI0UFArtOme.jpg','夏季新番精选','OP / ED · 2026 SUMMER']
];
const names={broadcast:'01 · 番组放送台',vinyl:'02 · OP/ED 唱片行',manga:'03 · 漫画分镜挑战'};
let theme='broadcast',page='home';
const img=(i,alt='')=>`<img src="${covers[i][0]}" alt="${alt}" loading="lazy" width="360" height="540">`;
const header=()=>`<header class="site-head"><div class="site-brand"><span class="brand-mark">♪</span><span>萌豚挑战</span></div><nav class="site-nav"><span>当季曲库</span><span>我的追番</span><span>开始挑战</span></nav></header>`;
function home(){return `<div class="page-content"><section class="home-lead"><div class="home-copy"><span class="eyebrow">2026 · SUMMER ANIME SONGS</span><h1>${theme==='manga'?'耳をすませ。':'这个季度，\n你听出几部？'}</h1><p>熟悉的前奏响起时，想起的是哪一部动画？从正在追的番到历年经典，挑一首歌开始。</p><div class="cta-row"><button class="cta" data-page="quiz">开始 10 题挑战　→</button><button class="secondary" data-page="library">逛逛曲库</button></div></div><div class="cover-stage">${img(0)}${img(1)}${img(2)}</div></section><div class="meta-strip"><span><b>345</b> 首可选歌曲</span><span><b>15</b> 部当季新番</span><span><b>30</b> 首季度曲库</span><span>曲库随你组合　↗</span></div><div class="section-head"><h2>本季片头片尾</h2><span>2026 年 7 月 · 挑几首熟悉的</span></div><div class="cover-grid">${[0,1,2].map(i=>card(i)).join('')}</div></div>`}
function card(i){return `<article class="anime-card"><div class="poster-wrap">${img(i,covers[i][1])}<span class="tag">${i===1?'ED':'OP'}</span></div><h3>${covers[i][1]}</h3><p>2026 夏 · ${i===2?'2':'1'} 首已收录歌曲</p><div class="song-line"><b>${covers[i][2]}</b><button type="button" aria-label="试听${covers[i][2]}">▶ 试听</button></div></article>`}
function library(){return `<div class="page-content"><div class="library-title"><div><span class="eyebrow">YOUR ANIME LIBRARY</span><h1>挑一部，听一首。</h1></div><div class="filter-row"><span>当前曲库 345</span><span>2026 夏</span><span>只看追番</span><span>OP + ED</span></div></div><div class="library-grid">${[0,1,2,3,0,1].map((x,i)=>card(x)).join('')}</div></div>`}
function quiz(){return `<div class="page-content"><div class="quiz-top"><strong>STAGE 01　猜番剧</strong><span>第 1 / 10 题　·　0 连击</span><strong>退出挑战　×</strong></div><div class="quiz-layout"><div><div class="quiz-art">${img(0,'当前播放曲目封面')}<button class="play-control" aria-label="播放">▶</button></div><div class="wave"></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>00:00</span><span>听 30 秒片段</span><span>00:30</span></div></div><div class="quiz-copy"><span class="eyebrow">LISTEN & GUESS</span><h2 style="font-size:26px;margin:5px 0 7px">这首歌来自哪部番？</h2><p style="color:var(--muted);font-size:12px;margin:0 0 19px">音源准备就绪 · 点播放开始听</p><div class="answers">${['Re：从零开始的异世界生活','关于我转生变成史莱姆','无职转生','葬送的芙莉莲'].map((x,i)=>`<button class="answer"><b>${String.fromCharCode(65+i)}</b>${x}</button>`).join('')}</div></div></div><div class="meta-strip"><span>答错时自动换源</span><span>音量　━━━━●━━　40%</span><span>连续答对会累积连击</span></div></div>`}
function render(){const d=document.querySelector('#device');d.className=`device ${theme}`;d.innerHTML=header()+(page==='home'?home():page==='library'?library():quiz())+`<div class="preview-caption">${names[theme]}　/　${page==='home'?'首页':page==='library'?'曲库浏览':'挑战答题'} · 视觉方向预览</div>`;document.querySelector('#directionName').textContent=names[theme];document.querySelectorAll('.preview-controls [data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelectorAll('.preview-controls [data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));}
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme]'),p=e.target.closest('[data-page]');if(t)theme=t.dataset.theme;if(p)page=p.dataset.page;if(t||p)render()});render();
</script>
</body>
</html>
