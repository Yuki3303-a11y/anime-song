name: Update library candidates

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC; keep checking until a complete pool is ready.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover current season
        id: season
        run: |
          KEY=$(node -e "const d=new Date(); process.stdout.write(d.getUTCFullYear()+'-'+String(1+3*Math.floor(d.getUTCMonth()/3)).padStart(2,'0'))")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          node scripts/fetch-season.mjs --out "candidates/$KEY"
          if node -e "process.exit(require('./candidates/$KEY.json').complete ? 0 : 1)"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pool incomplete; no review PR will be opened." >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -Fq "\"$KEY\":" seasonal-pools.js; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the review PR
        if: steps.season.outputs.complete == 'true' && steps.season.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.season.outputs.key }}
        run: |
          BRANCH="library-candidates-$KEY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git add "candidates/$KEY.json" "candidates/$KEY.md"
          if git diff --cached --quiet; then
            echo "No candidate changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Update $KEY seasonal song candidates"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "$KEY 季度曲库候选（待人工复核）" \
              --body "候选已凑齐 15 部番剧、30 首 OP/ED。请核对名称、歌手、类型和音源。此 PR 只包含候选；复核后另行加入 seasonal-pools.js 才会向玩家发布。"
          fi
